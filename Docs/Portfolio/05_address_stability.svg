<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="860" height="330" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d1453b"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d55"/></marker>
  </defs>

  <!-- 왼쪽: vector<DATA_T> -->
  <text x="30" y="36" font-size="18" font-weight="700" fill="#222">vector&lt;DATA_T&gt;</text>
  <text x="30" y="60" font-size="14" fill="#666">커지면 통째로 새 메모리로 이사</text>

  <text x="30" y="100" font-size="13" fill="#888">이전 메모리</text>
  <g fill="#f1f1f1" stroke="#bbb">
    <rect x="30" y="108" width="60" height="40"/><rect x="90" y="108" width="60" height="40"/><rect x="150" y="108" width="60" height="40"/>
  </g>
  <g font-size="15" fill="#aaa" text-anchor="middle"><text x="60" y="134">A</text><text x="120" y="134">B</text><text x="180" y="134">C</text></g>

  <text x="30" y="200" font-size="13" fill="#888">새 메모리</text>
  <g fill="#e8f0fe" stroke="#5b8def">
    <rect x="30" y="208" width="60" height="40"/><rect x="90" y="208" width="60" height="40"/><rect x="150" y="208" width="60" height="40"/><rect x="210" y="208" width="60" height="40"/>
  </g>
  <g font-size="15" fill="#222" text-anchor="middle"><text x="60" y="234">A</text><text x="120" y="234">B</text><text x="180" y="234">C</text><text x="240" y="234">D</text></g>

  <rect x="300" y="108" width="90" height="40" rx="8" fill="#fff" stroke="#d1453b"/>
  <text x="345" y="134" font-size="15" text-anchor="middle" fill="#222">Proxy</text>
  <line x1="300" y1="128" x2="214" y2="128" stroke="#d1453b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="250" y="178" font-size="14" fill="#d1453b" font-weight="700">✕ 옛 주소를 가리킴</text>

  <line x1="430" y1="20" x2="430" y2="310" stroke="#e5e5e5" stroke-width="2"/>

  <!-- 오른쪽: vector<unique_ptr<PAGE>> -->
  <text x="460" y="36" font-size="18" font-weight="700" fill="#222">vector&lt;unique_ptr&lt;PAGE&gt;&gt;</text>
  <text x="460" y="60" font-size="14" fill="#666">포인터만 늘어나고, 페이지는 제자리</text>

  <g fill="#f1f1f1" stroke="#999">
    <rect x="460" y="108" width="44" height="40"/><rect x="504" y="108" width="44" height="40"/>
  </g>
  <g font-size="13" fill="#444" text-anchor="middle"><text x="482" y="133">p0</text><text x="526" y="133">p1</text></g>

  <line x1="482" y1="148" x2="482" y2="205" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="526" y1="148" x2="660" y2="205" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="460" y="208" width="150" height="44" fill="#e8f0fe" stroke="#5b8def"/>
  <text x="535" y="235" font-size="14" text-anchor="middle" fill="#222">PAGE 0 (고정)</text>
  <rect x="640" y="208" width="150" height="44" fill="#f7f9fd" stroke="#5b8def" stroke-dasharray="5 4"/>
  <text x="715" y="235" font-size="14" text-anchor="middle" fill="#444">PAGE 1 (새로 추가)</text>

  <rect x="660" y="108" width="90" height="40" rx="8" fill="#fff" stroke="#1f9d55"/>
  <text x="705" y="134" font-size="15" text-anchor="middle" fill="#222">Proxy</text>
  <line x1="660" y1="140" x2="590" y2="206" stroke="#1f9d55" stroke-width="2" marker-end="url(#ag)"/>
  <text x="460" y="290" font-size="14" fill="#1f9d55" font-weight="700">✓ 페이지가 늘어나도 주소 유지</text>
</svg>
